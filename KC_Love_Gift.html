<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>K ❤️ C — Special Gift</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;overflow:hidden;background:radial-gradient(circle,#4a082c,#12000d 55%,#020003);font-family:Arial,sans-serif;color:white;display:flex;align-items:center;justify-content:center}
.bg{position:fixed;width:70vmin;height:70vmin;border-radius:50%;background:#ff176b;filter:blur(120px);opacity:.2;animation:bg 4s infinite alternate}
@keyframes bg{to{transform:scale(1.35);opacity:.35}}
.card{position:relative;width:330px;height:470px;border-radius:28px;box-shadow:0 0 30px #ff176b,0 0 80px #ff176b;background:linear-gradient(145deg,#ff4d91,#850039);padding:14px;transform-style:preserve-3d;animation:cardFloat 3s ease-in-out infinite}
@keyframes cardFloat{50%{transform:translateY(-8px)}}
.photoBox{position:relative;width:100%;height:330px;border-radius:20px;overflow:hidden;border:2px solid rgba(255,255,255,.75);box-shadow:0 0 25px #ff79aa}
.photoBox img{width:100%;height:100%;object-fit:cover;display:block}
.photoBox:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(70,0,30,.45))}
.heart{position:absolute;right:12px;top:12px;z-index:3;font-size:35px;filter:drop-shadow(0 0 10px #fff);animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.25)}}
.names{text-align:center;margin-top:16px;font-family:Georgia,serif;font-size:48px;font-weight:bold;letter-spacing:7px;text-shadow:0 0 8px white,0 0 20px #ffb0cf,0 0 40px #ff0055;animation:pulse 1.5s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.message{text-align:center;margin-top:8px;font-size:11px;letter-spacing:3px;color:#ffe4ef}
.tap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 18px;border:1px solid #ff8db5;border-radius:30px;background:rgba(255,20,100,.16);backdrop-filter:blur(8px);font-size:11px;letter-spacing:2px}
.float{position:fixed;bottom:-40px;pointer-events:none;color:#ff72a7;text-shadow:0 0 10px #ff176b;animation:up linear forwards;z-index:10}
@keyframes up{0%{transform:translateY(0) scale(.5);opacity:0}10%{opacity:1}100%{transform:translateY(-115vh) rotate(360deg) scale(1.2);opacity:0}}
.star{position:fixed;width:3px;height:3px;background:white;border-radius:50%;box-shadow:0 0 10px #ff9bc0;animation:twinkle 1.6s infinite alternate}
@keyframes twinkle{to{opacity:.15;transform:scale(.3)}}
.burst{position:fixed;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:white;box-shadow:0 0 15px #ff4f91;pointer-events:none;animation:burst 1.2s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
@media(max-width:500px){.card{width:300px;height:440px}.photoBox{height:300px}.names{font-size:42px}}
</style>
</head>

<script>
for(let i=0;i<90;i++){
 const s=document.createElement("div");s.className="star";
 s.style.left=Math.random()*100+"vw";s.style.top=Math.random()*100+"vh";
 s.style.animationDelay=Math.random()*2+"s";document.body.appendChild(s);
}
function heart(){
 const h=document.createElement("div");h.className="float";
 h.textContent=["❤️","💕","💖","💗","✨","♥"][Math.floor(Math.random()*6)];
 h.style.left=Math.random()*100+"vw";
 h.style.fontSize=(14+Math.random()*25)+"px";
 h.style.animationDuration=(4+Math.random()*5)+"s";
 document.body.appendChild(h);setTimeout(()=>h.remove(),9000);
}
setInterval(heart,300);

document.addEventListener("click",()=>{
 for(let i=0;i<30;i++){
  const p=document.createElement("div");p.className="burst";
  const a=Math.random()*Math.PI*2,d=80+Math.random()*350;
  p.style.setProperty("--x",Math.cos(a)*d+"px");
  p.style.setProperty("--y",Math.sin(a)*d+"px");
  document.body.appendChild(p);setTimeout(()=>p.remove(),1300);
 }
});
</script>
